name: unit-and-integration

# The Rust suites by layer, on Linux: the unit tests compiled inside each
# crate, the value objects with the mothers every test builds them through,
# and then the integration suites, which drive each crate through what it
# makes public. Each through its root Makefile target (`make test/unit`,
# `make test/values`, `make test/integration`), so a run here is a run anyone
# can repeat by hand.
#
# A workflow of its own beside test-and-build rather than jobs inside it:
# that one's job names are the checks the rulesets require, and a job added
# there would be one more name to require by hand. Here a failure says by
# its check's name which layer broke, which is what a regression in code
# reused far from where it changed needs first. macOS and Windows stay with
# test-and-build's test-cross, run when asked for, as they are there.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# A second push to a branch makes the run for the first one moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-layers-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run every crate's unit tests
        run: make test/unit

  # Beside the unit tests rather than after them: its own build, with the
  # `ts` and `schema` features, holds each value to what the panel and the
  # API are told of it, which no plain build compiles.
  values:
    name: value objects (rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-values-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run the value objects' tests and their mothers'
        run: make test/values

  # After both, as the slower layer: a unit or a value that fails says why
  # more plainly than the suites built on it, which would fail with it.
  integration:
    name: integration (rust)
    needs: [unit, values]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-layers-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The activation code is written for bash and zsh, and the runner
      # image has only bash: without zsh, half of the CLI's shells suite
      # would fail here, as it would in test (cli) without it.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run every crate's integration suites
        run: make test/integration
