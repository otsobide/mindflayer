name: test-and-build

# Per app: run its tests, and only if they pass, build it. Everything runs on
# Linux, on the repository's own runner, with the other two platforms on
# GitHub's, run only when asked for (see test-cross).
#
# GitHub's Linux runners stopped starting jobs once the account was locked
# over billing, so every Linux job asks for a self-hosted one by its labels,
# `[self-hosted, Linux, X64]`, rather than by its name: a second runner given
# the same labels takes jobs beside the first, which a single runner, one job
# at a time, runs one after another where GitHub's ran them side by side.
# Rejected: a repository variable naming the runner, which would switch back
# without a commit but leave this file no longer saying where a job runs.
on:
  push:
    branches: [main, dev]
  # `labeled` is not in the default set, and without it the `full-matrix` label
  # below would be a documented escape hatch that never fires: adding a label
  # would change nothing until the next push.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  # Runs first and everything waits on it: rustfmt and clippy need no test run,
  # so they answer quickly, and a tree that has to be pushed again anyway is
  # not worth a runner compiling twice.
  #
  # Formatting is checked on the merged result, not just per branch: two PRs
  # that are each formatted correctly can still merge into a tree that is not,
  # because git combines them textually and that is all it can do.
  checks:
    name: fmt and clippy
    runs-on: [self-hosted, Linux, X64]
    steps:
      # Root writes in a folder whose write permission is taken away, which
      # is how the suites make a write fail to see what is put back after
      # it: under root those tests fail, or pass without holding anything.
      # Said here, before anything compiles, rather than by the first of
      # them, a quarter of an hour into `test (core)`.
      - name: Check the runner does not run as root
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error::the runner runs as root, which writes where a test takes the permission away; run it as a user of its own, with sudo"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: make fmt/check

      - name: Run lint (no em dash, then clippy)
        run: make lint

  # -------------------------------------------------------------------------
  # Tests: one job per app. Job display names follow one convention,
  # `test (<app>)` and `build (<app>)`, so a check's name says what it does and
  # which app it belongs to; `types drift (web)` and `e2e (web)`, the two
  # checks that are neither, say it the same way.
  # -------------------------------------------------------------------------
  # Gate: the shared engine must pass before anything downstream runs.
  test-core:
    name: test (core)
    needs: checks
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test mindweaver-core
        run: make core/test

  test-cli:
    name: test (cli)
    needs: test-core
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The activation code is written for bash and zsh, and a runner's image
      # may have only bash. Without zsh, its half of tests/shells_test.rs, the
      # checks beside a virtualenv included, would run nowhere, and without a
      # python3 to make that virtualenv, neither half's; on CI either fails
      # the suite rather than skip. A self-hosted runner keeps what a job
      # installed, so each is installed only where it is missing.
      - name: Install zsh and python3 where missing
        run: |
          missing=
          command -v zsh >/dev/null || missing="$missing zsh"
          command -v python3 >/dev/null || missing="$missing python3"
          if [ -n "$missing" ]; then
            sudo apt-get update && sudo apt-get install -y $missing
          fi

      - name: Test mindweaver-cli
        run: make cli/test

  # The types the panel compiles against are written from core's and the
  # CLI's, and committed: a change to what either hands the panel that did
  # not write them again fails here. Cargo and git alone, so no Node: the
  # other half of `make web/types`, the panel checked against what is
  # committed, is `test (web)`'s vue-tsc, and the two together hold the
  # panel to what Rust writes. A job of its own rather than a step of
  # `test (cli)`, so a drift is a check that says so by its name, apart from
  # a test that failed, and is required on its own. The snapshots the
  # panel's tests render from are written from Rust and committed the same
  # way, so they drift the same way and are checked here too, under the
  # name the rulesets already require; and so are the API's JSON Schemas
  # and its OpenAPI document, here rather than in a job of their own, whose
  # name the rulesets would have to be changed by hand to require. Those
  # last, once the fixtures are written again from Rust: their check holds
  # every fixture to its schema, so it holds the schemas to what Rust
  # answers now, and the document, which holds the schemas, after them.
  types-drift:
    name: types drift (web)
    needs: test-core
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check the panel's types are the ones Rust writes
        run: make web/types/check

      - name: Check the panel's fixtures are the ones Rust writes
        run: make web/fixtures/check

      - name: Check the API's schemas are the ones Rust writes
        run: make api/schemas/check

      - name: Check the API's OpenAPI document is the one Rust writes
        run: make api/openapi/check

  # The server depends on no mindweaver crate, core included, so nothing here
  # needs core's tests to pass first. It waits for them anyway: core is the
  # gate for everything downstream, and a red core stops the run before it
  # spends a runner on anything else.
  test-server:
    name: test (server)
    needs: test-core
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test mindweaver-server
        run: make server/test

  # The panel needs no Rust, and no Rust job needs Node: none sets it up, and
  # the server builds without the panel there (rust-embed's
  # `allow_missing`). After core all the same, for the server's reason: a
  # red core stops the run before it spends a runner here.
  test-web:
    name: test (web)
    needs: test-core
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Before Node, whose cache asks pnpm where its store is. No version
      # here: the action reads the one `packageManager` pins, so a bump of
      # pnpm is one line in package.json, as it is for everybody else.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: apps/web/.node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      # Every target below would install on its own first; a step of its
      # own says how long the install took, apart from the checks.
      - name: Install the panel's dependencies
        run: make web/install

      - name: Lint the panel
        run: make web/lint

      - name: Check the panel's types
        run: make web/typecheck

      - name: Test the panel
        run: make web/test

      - name: Build the panel
        run: make web/build

      # For `build (cli)`, which embeds it in the release it builds, so the
      # panel a binary ships is the one this job tested. Kept a week, long
      # enough to run that job again, since nothing else reads it.
      - name: Upload the built panel
        uses: actions/upload-artifact@v6
        with:
          name: panel
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  # The whole suite on the two platforms Linux cannot speak for. Linux runs on
  # every push and every pull request; these two run only when asked for, by
  # hand (workflow_dispatch) or with the `full-matrix` label on a PR.
  #
  # Development targets Linux only until the compatibility pass (#154). Until
  # then both platforms fail, and running them on every push to dev would spend
  # runners that cost several times a Linux one on a known red, and skip the
  # Linux builds below, which wait for this job to pass or be skipped. That
  # pass puts them back on the shipping branches: any push to dev or main, or a
  # PR from dev, main or release/*.
  #
  # This app finds projects by walking up a directory tree and identifies them
  # by marker files, which is exactly the kind of code that behaves differently
  # on Windows, so the matrix stays, ready for that pass.
  test-cross:
    name: test (${{ matrix.label }})
    needs: test-core
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-matrix')
    strategy:
      # One platform failing must not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cross-

      # `make test` runs the panel's suite too, so the whole suite needs
      # Node and pnpm here, set up as `test (web)` sets them up.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: apps/web/.node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      # bash, not pwsh: the make targets are POSIX recipes, and Git Bash on
      # PATH is what makes GNU make pick sh.exe instead of cmd.exe. Harmless on
      # macOS, where bash is the default anyway.
      #
      # `-k`, as `fail-fast` is off above: one app failing on a platform must
      # not hide whether the others pass there, and make stops at the first
      # app that fails otherwise.
      - name: Run the suite
        shell: bash
        run: make -k test

  # -------------------------------------------------------------------------
  # Builds: each app builds only after its own tests pass, and never while the
  # platforms it ships to are unproven. Each builds in debug first, then its
  # release, the optimized build that ships, as a step after it rather than a
  # job of its own: a debug build that fails says so sooner and cheaper, and
  # the check keeps the name the rulesets require. The tests are per app
  # alone, not per layer: a unit, a value object and an integration suite of
  # one app fail under that app's check, in one cargo run.
  #
  # The `if` is spelled out rather than the usual `always() && !failure()`
  # idiom, which is wrong twice over: a skipped dependency skips this job, so
  # test-cross being gated off on a feature branch would take the build with
  # it, and a job skipped because something upstream FAILED also reports
  # `skipped`, so the idiom would happily build after test (core) had failed.
  # -------------------------------------------------------------------------
  build-core:
    name: build (core)
    needs: [test-core, test-cross]
    if: >-
      always() &&
      needs.test-core.result == 'success' &&
      (needs.test-cross.result == 'success' || needs.test-cross.result == 'skipped')
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build mindweaver-core
        run: make core/build

      - name: Build mindweaver-core for release
        run: make core/release

  # The binaries ship the panel, so they wait for its tests as well as their
  # own, and embed the panel `test (web)` built rather than one built again
  # here: the one that passed is the one a binary ships.
  build-cli:
    name: build (cli)
    needs: [test-cli, test-web, test-cross]
    if: >-
      always() &&
      needs.test-cli.result == 'success' &&
      needs.test-web.result == 'success' &&
      (needs.test-cross.result == 'success' || needs.test-cross.result == 'skipped')
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Where the server embeds the panel from, before anything compiles it.
      - name: Download the built panel
        uses: actions/download-artifact@v7
        with:
          name: panel
          path: apps/web/dist

      - name: Build mindweaver-cli
        run: make cli/build

      # The runner's own triple, so the release built for it can be run.
      - name: Name the runner's target
        run: |
          echo "TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"

      # A release, since only a release embeds the panel; a debug build reads
      # the folder as each request comes in. No step of this job sets up
      # pnpm, so on a runner with none of its own `make cli/release` says
      # the panel is not built here and embeds the one downloaded above
      # (docs/architecture.md, open questions, for a runner that has one).
      - name: Build mindweaver-cli for release, the panel embedded
        run: make cli/release TARGET="$TARGET"

      # With the folder gone, so a binary reading it could not pass: the
      # release has to serve the panel from itself.
      - name: Check the release serves the panel with no apps/web/dist
        run: |
          rm -rf apps/web/dist
          make cli/release/check TARGET="$TARGET"

      # For `e2e (web)`, which drives the panel in this release, once it has
      # been seen to serve it, rather than build the binaries, or the panel,
      # again. Kept a week, as the panel is.
      - name: Upload the release's binaries
        uses: actions/upload-artifact@v6
        with:
          name: binaries
          path: |
            target/${{ env.TARGET }}/release/mindweaver
            target/${{ env.TARGET }}/release/mind
          if-no-files-found: error
          retention-days: 7

  # The panel end to end (apps/web/e2e): the release `build (cli)` built,
  # with the panel `test (web)` built in it, serving a workspace the suite
  # builds with its commands, driven in Chromium and WebKit. Nothing is
  # built here: the binaries and the panel driven are the ones a release
  # ships. Linux alone, which Playwright's WebKit runs on with the
  # libraries `--with-deps` installs; macOS and Windows are out of its
  # scope. A failed test's trace, and the report, are uploaded.
  #
  # The `if` is spelled out for the reason given above `build-core`: the
  # implicit `success()` looks at every job upstream, not only `build-cli`,
  # so test-cross gated off would skip this job too, and a skipped required
  # check passes. `!cancelled()` rather than `always()`, so cancelling the
  # run stops twenty minutes of browsers as well, which `always()` would
  # keep running.
  e2e-web:
    name: e2e (web)
    needs: build-cli
    if: >-
      !cancelled() &&
      needs.build-cli.result == 'success'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: apps/web/.node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install the panel's dependencies
        run: make web/install

      # Into node_modules, at the version the lockfile's Playwright names,
      # with the system libraries each needs, which only this step installs
      # with sudo.
      - name: Install the browsers
        run: make web/e2e/browsers WITH_DEPS=1

      # Outside the checkout, so nothing the suite runs is in the
      # repository; an artifact keeps no file mode, so they are made
      # executable again.
      - name: Download the release's binaries
        uses: actions/download-artifact@v7
        with:
          name: binaries
          path: ${{ runner.temp }}/binaries

      - name: Make the binaries executable
        run: chmod +x "$RUNNER_TEMP/binaries/mindweaver" "$RUNNER_TEMP/binaries/mind"

      - name: Run the panel end to end
        run: make web/e2e/run E2E_BIN="$RUNNER_TEMP/binaries"

      - name: Upload the traces of what failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-traces
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  build-server:
    name: build (server)
    needs: [test-server, test-cross]
    if: >-
      always() &&
      needs.test-server.result == 'success' &&
      (needs.test-cross.result == 'success' || needs.test-cross.result == 'skipped')
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build mindweaver-server
        run: make server/build

      - name: Build mindweaver-server for release
        run: make server/release
