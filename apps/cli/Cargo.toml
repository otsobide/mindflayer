[package]
name = "mindflayer-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
# clap shows this as the tool's one-line `--help` summary, so it says what the
# tool does rather than what kind of crate it is.
description = "Manage agent skills across mind projects"
# Two binaries leave `cargo run` unable to choose, which breaks `make run`.
# `mind` is the one that reaches both levels (`mind flayer <cmd>`).
default-run = "mind"

# Not `mf`: that is METAFONT, which ships with every TeX distribution and is
# already on the PATH of anyone who writes LaTeX.
[[bin]]
name = "mind"
path = "src/main.rs"

# `flayer <cmd>` is `mind flayer <cmd>`. A second entry point into the same
# parser, not a wrapper that re-executes `mind`, so the two spellings share one
# implementation and cannot drift apart.
[[bin]]
name = "flayer"
path = "src/bin/flayer.rs"

# The command surface is a library so integration tests (and, later, other
# front ends) can drive the real parser instead of shelling out to the binary.
[lib]
name = "mindflayer_cli"
path = "src/lib.rs"

[features]
default = ["ui"]
# The control panel: the local server, the CLI's backend over it, a runtime
# to serve it on and a browser to open it in. On by default, so the one
# binary somebody installs has it (D-17); without it, `--no-default-features`
# builds the commands and the TUI and nothing that serves HTTP.
ui = ["dep:mindflayer-server", "dep:tokio", "dep:webbrowser"]
# The TypeScript types of what the panel sends the CLI's backend and is
# answered with, and core's beside them (#70): `make web/types` builds with
# it to write them into the panel, and nothing else does. With `ui`, whose
# backend the panel's queries and outcomes are.
ts = ["ui", "dep:ts-rs", "mindflayer-core/ts"]

[dependencies]
mindflayer-core = { path = "../core" }
# The local server behind the web panel, whose `Backend` the CLI implements
# (`backend`): the front end depends on the transport, never the other way
# (D-17).
mindflayer-server = { path = "../server", optional = true }
# What `ui` serves the panel on: a runtime of one thread, since every query
# and run goes off it anyway, and Ctrl-C to stop it. The version the server
# builds.
tokio = { version = "1", features = ["rt", "signal", "sync"], optional = true }
# What `ui` opens the panel's link in: whichever browser the system has, the
# way it starts one, on each platform.
webbrowser = { version = "1", optional = true }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
ratatui = "0.30.2"
# What a reading command's `--json` prints: core's types derive Serialize, and
# the envelope around them is laid out here, as a table is. The versions the
# server already builds.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# What derives the panel's types, under `ts`, as core's are derived. Without
# its warnings, as core takes it: the serde attribute it cannot read here is
# an enum's `deny_unknown_fields`, which says what a task may hold when it is
# read, not what one is.
ts-rs = { version = "12", optional = true, features = ["no-serde-warnings"] }

[dev-dependencies]
# `dirwalk`, to ask in process what git would list as untracked in a project
# `mind init` made. It builds nothing new: core's gix already has it.
gix = { version = "0.87", default-features = false, features = ["dirwalk"] }
mindflayer-core = { path = "../core" }
# To leave in a workspace's database what an older Mindflayer would have, which
# nothing this one writes can, for the suites that check it is scrubbed. The
# same version and features as core's, so it is one build of SQLite.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
tempfile = "3"
# To wait, bounded, for what the panel's watcher tells (`live_test`): the
# runtime and timers the server's own suites use, and the version it builds.
tokio = { version = "1", features = ["macros", "rt", "time"] }
