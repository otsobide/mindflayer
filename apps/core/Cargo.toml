[package]
name = "mindflayer-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Mind projects, flayer workspaces, and the skills they hold"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# Skill front matter is YAML, so it is parsed by a YAML parser rather than by
# line splitting of our own: descriptions routinely use quoting and block
# scalars, and allowed-tools is a list. serde_yaml_ng is the maintained
# continuation of serde_yaml, which upstream archived.
serde_yaml_ng = "0.10"
# The marker files (.mind/settings.toml, .mind/mind.toml,
# .mindflayer/flayer.toml) are TOML: the format the Rust toolchain already
# asks everyone here to read and write.
toml = "0.9"
# Reading a marker is serde's job, or a key at a time for a project's
# settings; *editing* one is not. Re-serializing would drop the comments that
# explain the file, so `link`, `unlink` and a change of a project's settings
# go through toml_edit, which rewrites what changed and leaves the rest of the
# bytes alone. This is the crate cargo itself edits Cargo.toml with.
toml_edit = "0.25"
# JSON and JSONC config files that agents and people share (`.mcp.json`,
# `opencode.json`) are edited the way toml_edit edits TOML: one entry changed
# in a tree that holds every byte, comments and whitespace included. `cst` is
# that tree; serde_json would rewrite the whole file in its own layout and
# drop every comment. dprint's own crate, which Deno edits deno.json with.
jsonc-parser = { version = "0.34", features = ["cst"] }
# `progress-tree` for the tree a gather reads gix's counts off while it fetches
# (`gather::git`). It builds no new crate: the tree is prodash's, which
# gix-features already builds with the tree in.
gix = { version = "0.87", features = ["blocking-network-client", "blocking-http-transport-reqwest-rust-tls", "progress-tree"] }
# `backup`, for the copy taken before a schema step: SQLite's own online
# backup, since reading the file from outside while a connection holds it
# would drop that connection's locks on Unix.
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "backup"] }
# The content hash of an installed copy is SHA-256, from the RustCrypto
# implementation rather than one of our own. 0.11, the version the server's
# rust-embed already builds, so the workspace gains no second sha2.
sha2 = "0.11"
# The read model's types in TypeScript, for the panel to compile against
# (#70): derived beside the serde derive each type has, so that what the
# panel is told a snapshot holds is what serde writes, read off the same
# attributes (its default `serde-compat`). Only under `ts`, which nothing
# builds by default, so a plain build compiles none of it and a plain
# `cargo test` writes no file. `no-serde-warnings`, since the one serde
# attribute it cannot read here is `serialize_with`, which writes a path or
# a URL as the text it already is in TypeScript: a test holds each function
# a field names to what ts-rs says of the type it takes, and refuses one it
# does not hold, where the warning would only scroll past in a build. A type
# written some other way says so with `ts(as)`, held to it by a test.
ts-rs = { version = "12", optional = true, features = ["no-serde-warnings"] }
# What core hands a front end and takes from one as JSON Schema 2020-12, for
# the local server's API (D-24, #217), derived beside each type's serde
# derive as ts-rs is, and read off the same attributes, which schemars reads
# as serde does. 1.x, the current major, whose default is 2020-12 and which
# says a type either as serde writes it or as serde reads it: an `Option`
# field is always written, and may be left out of what is read. Only under
# `schema`, as ts-rs is under `ts`. MIT, as are its derive and the two small
# crates it brings; serde_json beside it to write what a type says by hand.
schemars = { version = "1.2", optional = true }
serde_json = { version = "1", optional = true }

[features]
# The TypeScript types of what core hands a front end: `make web/types`
# builds with it to write them into the panel, and nothing else does.
ts = ["dep:ts-rs"]
# The JSON Schema of what core hands a front end and takes from one: `make
# api/schemas` builds with it to write them into docs/api/schemas, and
# nothing else does.
schema = ["dep:schemars", "dep:serde_json"]

[dev-dependencies]
# To pin what a report's types serialize to, name by name: what a front end
# prints as JSON is a contract. The version the server already builds.
serde_json = "1"
tempfile = "3"
# What holds each schema written by hand to what serde writes: a JSON
# Schema 2020-12 validator that passes the suite of tests JSON Schema
# publishes, and builds no HTTP client, nor anything else that reaches the
# network: its one loader of a `$ref` reads a file, and the tests take even
# that away. Its default features off all the same, so a later release that
# adds a loader by default does not bring it in. MIT or Apache-2.0; what it
# brings is MIT (appendlist, fluent-uri), MIT or Apache-2.0 (ahash),
# BSD-2-Clause, Apache-2.0 or MIT (zerocopy) and MIT-0 (borrow-or-share),
# each a licence GPL-3.0-only takes in. jsonschema was the other, whose
# defaults build reqwest for a remote `$ref`, and which brings some thirty
# crates to this one's six.
boon = { version = "0.6", default-features = false }
