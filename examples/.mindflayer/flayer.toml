# Mindflayer workspace: the examples that ship with Mindflayer.
#
# A couple of skills and rules to try Mindflayer with, without gathering
# anything first. Load this folder into the workspace that manages your
# projects with `flayer load <path>`, and install them from there. It manages
# no projects and loads nothing: it only offers its own.
#
# `directories` is spelled out rather than left to the default, so this folder
# reads the same whatever a new workspace keeps its own in. Beside this
# .mindflayer rather than inside it, so the examples are where somebody
# browsing the repository looks for them.
version = 2
name = "examples"
projects = []
loaded = []

[directories]
skills = "skills"
rules = "rules"
